async function unlock(){
  const pw=document.getElementById('pw').value, err=document.getElementById('err');
  err.textContent='';
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);

    const c=document.getElementById('content'); c.innerHTML=html; c.style.display='block';
    document.title='Astana Hub · выборка (открыто)';
  }catch(e){ err.textContent='Неверный пароль'; }
}

<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Astana Hub · аутрич · приватная выборка</title>
<style>
:root{--bg:#f4f4f2;--card:#fff;--card2:#f7f9fb;--line:#e3e8ef;--tx:#1a1a1a;--mut:#5c6b80;--blue:#0a66c2;--grn:#137333;--amb:#b7791f;--red:#c0392b;--sh:0 1px 3px rgba(20,40,80,.08);}
*{box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Arial,sans-serif;margin:0;background:var(--bg);color:var(--tx);}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 60px;}
a{color:var(--blue);}
.gate{max-width:400px;margin:14vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:28px 26px;text-align:center;}
.gate h1{font-size:19px;margin:0 0 6px;} .gate p{font-size:13px;color:var(--mut);margin:0 0 18px;line-height:1.5;}
.gate input{width:100%;padding:11px 13px;font-size:15px;border:1px solid #cdd5e0;border-radius:9px;margin-bottom:10px;background:#fff;color:var(--tx);}
.gate button{width:100%;padding:11px;font-size:15px;font-weight:700;color:#fff;background:var(--blue);border:none;border-radius:9px;cursor:pointer;}
.gate .err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px;}
#content{display:none;}
.intro{font-size:12.5px;color:var(--mut);line-height:1.6;margin-bottom:16px;}
h1.top{font-size:23px;margin:2px 0 2px;letter-spacing:-.02em;} .kick{font-size:11px;letter-spacing:.08em;color:var(--blue);text-transform:uppercase;font-weight:700;}
#funnel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:18px 20px;margin-bottom:22px;}
.fnl-row{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.fnl-row .lb{width:120px;font-size:11.5px;color:var(--mut);text-align:right;text-transform:uppercase;letter-spacing:.05em;}
.fnl-bar{flex:1;background:#eef2f7;border-radius:6px;height:26px;overflow:hidden;}
.fnl-fill{height:100%;border-radius:6px;min-width:30px;display:flex;align-items:center;justify-content:flex-end;padding-right:9px;color:#fff;font-weight:800;font-size:12px;transition:width .3s;}
.fnl-row .cv{width:44px;font-size:11px;color:var(--mut);}
.fnl-sub{display:flex;gap:20px;margin-top:12px;border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--mut);flex-wrap:wrap;}
h2.grp{font-size:16px;margin:26px 0 12px;border-bottom:2px solid var(--line);padding-bottom:6px;} h2.grp span{color:var(--mut);font-weight:400;font-size:13px;}
.contact{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:18px 20px;margin-bottom:16px;}
.chead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:14px;}
.cname{font-size:16px;font-weight:700;} .crole{font-size:12.5px;color:var(--mut);margin-top:2px;} .cwhy{font-size:12px;color:#48505e;margin-top:6px;line-height:1.5;}
.ctag{font-size:9.5px;padding:2px 8px;border-radius:20px;vertical-align:middle;font-weight:700;letter-spacing:.05em;background:#eef3f8;color:var(--blue);}
.cconf{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:5px 11px;border-radius:20px;white-space:nowrap;}
.conf-высокая{background:#e6f4ec;color:var(--grn);border:1px solid #b7e0c6;}
.conf-средняя{background:#fdf4e3;color:var(--amb);border:1px solid #f0dca8;}
.conf-низкая{background:#fbeae8;color:var(--red);border:1px solid #f0c4bd;}
.flag{font-size:11.5px;color:var(--red);margin-top:6px;}
.pipe{display:flex;gap:6px;background:#f0f3f7;border:1px solid var(--line);border-radius:10px;padding:5px;margin-bottom:14px;flex-wrap:wrap;}
.pipe .st{flex:1;min-width:88px;padding:8px 6px;font-size:10.5px;font-weight:700;letter-spacing:.04em;border:none;border-radius:7px;background:transparent;color:var(--mut);cursor:pointer;font-family:inherit;transition:.15s;}
.pipe .st:hover{background:#e4e9f0;color:var(--tx);}
.pipe .st.on-sent{background:var(--blue);color:#fff;} .pipe .st.on-accepted{background:#2563eb;color:#fff;}
.pipe .st.on-replied{background:var(--grn);color:#fff;} .pipe .st.on-rejected{background:#7f1d1d;color:#fff;} .pipe .st.on-plan{background:#7a8aa0;color:#fff;}
.mb{margin-bottom:12px;} .mlabel{font-size:10.5px;letter-spacing:.05em;color:var(--mut);text-transform:uppercase;margin-bottom:6px;} .msub{color:#8a94a3;text-transform:none;letter-spacing:0;}
.mbody{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;} .mtext{font-size:12.5px;line-height:1.65;white-space:normal;}
.mact{margin-top:6px;} .copy,.linkedin{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:6px 12px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--tx);cursor:pointer;font-family:inherit;}
.copy:hover{border-color:var(--blue);color:var(--blue);}
.note{margin-top:12px;} .ntext{width:100%;min-height:52px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--tx);font-family:inherit;font-size:12.5px;resize:vertical;}
.foot{font-size:11px;color:#8a94a3;margin-top:30px;border-top:1px solid var(--line);padding-top:14px;}
/* ---- сворачивание списков ---- */
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.ctrls button{font-size:11.5px;font-weight:700;letter-spacing:.03em;padding:8px 14px;border:1px solid var(--line);border-radius:100px;background:#fff;color:var(--tx);cursor:pointer;font-family:inherit;}
.ctrls button:hover{border-color:var(--blue);color:var(--blue);}
.ctrls .hint{font-size:11.5px;color:var(--mut);}
h2.grp{cursor:pointer;user-select:none;display:flex;align-items:center;gap:9px;}
h2.grp:hover{color:var(--blue);}
.gchev{font-size:11px;color:var(--mut);transition:transform .2s;display:inline-block;}
.gcount{margin-left:auto;font-size:11.5px;font-weight:400;color:var(--mut);background:#eef3f8;padding:3px 11px;border-radius:100px;}
.grpwrap.closed .gchev{transform:rotate(-90deg);}
.grpwrap.closed .grp-body{display:none;}
.chead-l{display:flex;gap:10px;align-items:flex-start;flex:1;min-width:0;}
.ctoggle{flex:none;width:24px;height:24px;line-height:1;font-size:11px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--mut);cursor:pointer;font-family:inherit;transition:.15s;margin-top:1px;}
.ctoggle:hover{border-color:var(--blue);color:var(--blue);}
.contact.closed .ctoggle{transform:rotate(-90deg);}
.contact.closed .cbody{display:none;}
.contact.closed .crole,.contact.closed .cwhy,.contact.closed .flag{display:none;}
.contact.closed{padding:12px 20px;}
</style></head><body>

  <h1>🔒 Приватная выборка</h1>
  <p>Astana Hub · LinkedIn-аутрич, пилот Дубай.<br>Введите пароль для доступа.</p>
  <input type="password" id="pw" placeholder="Пароль" autocomplete="off" autofocus>
  <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);margin:0 0 12px;cursor:pointer;text-align:left;">
    <input type="checkbox" id="remember" checked style="width:auto;margin:0;"> Запомнить на этом устройстве
  </label>
  <button id="go">Открыть</button>
  <div class="err" id="err"></div>
</div>
<div class="wrap"><div id="content">
  <div class="kick">Astana Hub · LinkedIn-аутрич · приватно</div>

</div></div>

function lsGet(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function renderFunnel(){
  const cs=[...document.querySelectorAll('.contact')];
  const cnt={plan:0,sent:0,accepted:0,replied:0,rejected:0};
  cs.forEach(c=>{cnt[c.dataset.status||'plan']++});
  const total=cs.length;
  // воронка: активные касания = sent+accepted+replied (rejected и plan отдельно)
  const funnelOrder=[['plan',cnt.plan],['sent',cnt.sent+cnt.accepted+cnt.replied+cnt.rejected],['accepted',cnt.accepted+cnt.replied],['replied',cnt.replied],['rejected',cnt.rejected]];
  const labels={plan:'В плане',sent:'Отправлено',accepted:'Принято',replied:'Ответили',rejected:'Не подошёл'};
  const cols={plan:'#3a3a4a',sent:'#8b5cf6',accepted:'#60a5fa',replied:'#34d399',rejected:'#f87171'};
  const base=funnelOrder[1][1]||total||1;
  let h='';
  funnelOrder.forEach(([k,v],i)=>{
    const w=Math.max(6,Math.round(v/(total||1)*100));
    const cv=(i>1&&funnelOrder[1][1])?Math.round(v/funnelOrder[1][1]*100)+'%':'';
    h+='<div class="fnl-row"><div class="lb">'+labels[k]+'</div><div class="fnl-bar"><div class="fnl-fill" style="width:'+w+'%;background:'+cols[k]+'">'+v+'</div></div><div class="cv">'+cv+'</div></div>';
  });
  const byWho={};
  cs.forEach(c=>{const w=c.dataset.who;byWho[w]=byWho[w]||{sent:0,rep:0};if((c.dataset.status||'plan')!=='plan'&&c.dataset.status!=='rejected')byWho[w].sent++;if(c.dataset.status==='replied')byWho[w].rep++;});
  h+='<div class="fnl-sub">'+Object.keys(byWho).map(w=>'<span><b style="color:#1a1a1a">'+w+'</b>: в работе '+byWho[w].sent+' · ответили '+byWho[w].rep+'</span>').join('')+'<span>Всего: '+total+'</span></div>';
  document.getElementById('funnel').innerHTML=h;
}
function setStatus(c,st,fromCloud){
  c.dataset.status=st; lsSet('ahout_'+c.dataset.id,st);
  c.querySelectorAll('.pipe .st').forEach(b=>{b.className='st'+(b.dataset.st===st?' on-'+st:'')});
  renderFunnel();
  if(!fromCloud) cloudPush(c.dataset.id,{status:st});
}

/* ============ облачная синхронизация (Google Sheets через Apps Script) ============ */
var CLOUD={ep:'',tok:'',on:false};
function cloudInit(){
  var el=document.getElementById('cfg');
  CLOUD.ep=(el&&el.dataset.ep)||lsGet('ahep','');
  CLOUD.tok=(el&&el.dataset.tok)||lsGet('ahtok','');
  CLOUD.on=!!CLOUD.ep;
  return CLOUD.on;
}
function meName(){
  var w=lsGet('ahme','');
  if(!w){ w=(prompt('Кто вы? Это увидят коллеги в таблице.\n(Нур / Асхат / Лана / Иван)','')||'').trim()||'—'; lsSet('ahme',w); }
  return w;
}
function syncMark(state,txt){
  var el=document.getElementById('syncbadge'); if(!el) return;
  var map={ok:['#e6f4ec','#137333'],err:['#fdf4e3','#b7791f'],off:['#eef3f8','#5c6b80']};
  var c=map[state]||map.off;
  el.style.background=c[0]; el.style.color=c[1]; el.textContent=txt;
}
function hhmm(){ var d=new Date(); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function cloudPush(id,patch){
  if(!CLOUD.on) return;
  var body=Object.assign({token:CLOUD.tok,id:id,who:meName()},patch);
  fetch(CLOUD.ep,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
    .then(function(){ syncMark('ok','☁ синхронизировано '+hhmm()); })
    .catch(function(){ syncMark('err','⚠ офлайн — сохранено локально'); });
}
/* Разовый перенос: локальные отметки, сделанные ДО включения синхронизации,
   уезжают в облако ПЕРЕД первым чтением — иначе облако затрёт их дефолтом. */
function cloudMigrateOnce(){
  if(!CLOUD.on || lsGet('ahmigrated','')==='1') return Promise.resolve();
  var pending=[];
  document.querySelectorAll('.contact').forEach(function(c){
    var id=c.dataset.id, st=lsGet('ahout_'+id,'plan'), nt=lsGet('ahnote_'+id,'');
    if(st!=='plan'||nt) pending.push({id:id,status:st,note:nt});
  });
  lsSet('ahmigrated','1');
  if(!pending.length) return Promise.resolve();
  syncMark('off','☁ переношу отметки: '+pending.length+'…');
  var me=meName();
  return Promise.all(pending.map(function(p){
    return fetch(CLOUD.ep,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({token:CLOUD.tok,id:p.id,status:p.status,note:p.note,who:me})}).catch(function(){});
  }));
}
function cloudPull(){
  if(!CLOUD.on) return;
  fetch(CLOUD.ep+'?token='+encodeURIComponent(CLOUD.tok)+'&t='+Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d||!d.ok) throw new Error('bad');
      (d.rows||[]).forEach(function(row){
        var c=document.querySelector('.contact[data-id="'+row.id+'"]'); if(!c) return;
        if(row.status && row.status!==c.dataset.status) setStatus(c,row.status,true);
        var ta=c.querySelector('.ntext');
        if(ta && typeof row.note==='string' && document.activeElement!==ta && ta.value!==row.note){
          ta.value=row.note; lsSet('ahnote_'+row.id,row.note);
        }
      });
      syncMark('ok','☁ синхронизировано '+hhmm());
    })
    .catch(function(){ syncMark('err','⚠ офлайн — сохранено локально'); });
}
function addSyncUI(){
  var bar=document.querySelector('.ctrls'); if(!bar||document.getElementById('syncbadge')) return;
  var b=document.createElement('span'); b.id='syncbadge';
  b.style.cssText='font-size:11.5px;font-weight:700;padding:7px 13px;border-radius:100px;background:#eef3f8;color:#5c6b80;';
  bar.insertBefore(b,bar.firstChild);
  if(CLOUD.on){ syncMark('off','☁ подключение…'); }
  else{
    syncMark('off','⚙ синхронизация не настроена');
    b.style.cursor='pointer'; b.title='Нажмите, чтобы указать адрес синхронизации';
    b.onclick=function(){
      var ep=(prompt('URL веб-приложения Apps Script (…/exec):',lsGet('ahep',''))||'').trim();
      if(!ep) return;
      var tk=(prompt('TOKEN из скрипта:',lsGet('ahtok',''))||'').trim();
      lsSet('ahep',ep); lsSet('ahtok',tk); location.reload();
    };
  }
}
// собираем сворачиваемую структуру: тело контакта + группы по участникам
function buildCollapsible(){
  // 1. тело каждого контакта -> .cbody, кнопка-стрелка в шапку
  document.querySelectorAll('.contact').forEach(c=>{
    if(c.querySelector('.cbody')) return;
    const head=c.querySelector('.chead'), pipe=c.querySelector('.pipe');
    const body=document.createElement('div'); body.className='cbody';
    let n=pipe?pipe.nextSibling:null;
    while(n){ const nx=n.nextSibling; body.appendChild(n); n=nx; }
    c.appendChild(body);
    // шапка: обернуть левую часть и добавить тоггл
    if(head && !head.querySelector('.ctoggle')){
      const left=document.createElement('div'); left.className='chead-l';
      const btn=document.createElement('button'); btn.className='ctoggle'; btn.textContent='▾';
      btn.title='Свернуть / развернуть сообщения';
      const first=head.firstElementChild;
      head.insertBefore(left,first); left.appendChild(btn);
      if(first && first!==left) left.appendChild(first);
      btn.onclick=e=>{e.stopPropagation();toggleContact(c);};
    }
  });
  // 2. группы: h2.grp + следующие контакты -> .grpwrap > .grp-body
  document.querySelectorAll('h2.grp').forEach(h=>{
    if(h.parentElement && h.parentElement.classList.contains('grpwrap')) return;
    const wrap=document.createElement('div'); wrap.className='grpwrap';
    // стабильный ключ: только буквы имени участника, без счётчиков
    wrap.dataset.grp=(h.textContent.split('·')[0]||'').replace(/[^А-Яа-яЁёA-Za-z]/g,'').slice(0,16);
    const body=document.createElement('div'); body.className='grp-body';
    h.parentNode.insertBefore(wrap,h); wrap.appendChild(h); wrap.appendChild(body);
    let n=wrap.nextSibling;
    while(n){ const nx=n.nextSibling;
      if(n.nodeType===1 && n.tagName==='H2') break;
      body.appendChild(n); n=nx; }
    const chev=document.createElement('span'); chev.className='gchev'; chev.textContent='▾';
    h.insertBefore(chev,h.firstChild);
    const cnt=document.createElement('span'); cnt.className='gcount';
    cnt.textContent=body.querySelectorAll('.contact').length+' контактов';
    h.appendChild(cnt);
    h.onclick=()=>toggleGroup(wrap);
  });
}
function toggleContact(c,force){
  const closed = force===undefined ? !c.classList.contains('closed') : force;
  c.classList.toggle('closed',closed); lsSet('ahcol_'+c.dataset.id,closed?'1':'0');
}
function toggleGroup(w,force){
  const closed = force===undefined ? !w.classList.contains('closed') : force;
  w.classList.toggle('closed',closed);
  lsSet('ahgrp_'+(w.dataset.grp||''),closed?'1':'0');
}
function addControls(){
  if(document.querySelector('.ctrls')) return;
  const bar=document.createElement('div'); bar.className='ctrls';
  const b1=document.createElement('button'); b1.textContent='Свернуть всё';
  const b2=document.createElement('button'); b2.textContent='Развернуть всё';
  const hint=document.createElement('span'); hint.className='hint';
  hint.textContent='Клик по имени участника скрывает его список · стрелка у контакта скрывает сообщения';
  b1.onclick=()=>{document.querySelectorAll('.contact').forEach(c=>toggleContact(c,true));
                  document.querySelectorAll('.grpwrap').forEach(w=>toggleGroup(w,true));};
  b2.onclick=()=>{document.querySelectorAll('.contact').forEach(c=>toggleContact(c,false));
                  document.querySelectorAll('.grpwrap').forEach(w=>toggleGroup(w,false));};
  bar.appendChild(b1); bar.appendChild(b2); bar.appendChild(hint);
  const f=document.getElementById('funnel');
  f.parentNode.insertBefore(bar,f.nextSibling);
}
function initOutreach(){
  document.querySelectorAll('.contact').forEach(c=>{
    // who from preceding h2
    let el=c.previousElementSibling; while(el&&!el.classList.contains('grp'))el=el.previousElementSibling;
    c.dataset.who=el?el.textContent.split('·')[0].trim():'';
    // true = не отправлять в облако: это восстановление локального состояния,
    // иначе свежая вкладка затёрла бы чужие статусы дефолтным «в плане»
    const st=lsGet('ahout_'+c.dataset.id,'plan'); setStatus(c,st,true);
    c.querySelectorAll('.pipe .st').forEach(b=>b.onclick=()=>setStatus(c,b.dataset.st));
    c.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{
      const t=b.closest('.mb').querySelector('.mtext').innerText;
      navigator.clipboard.writeText(t).then(()=>{const o=b.textContent;b.textContent='СКОПИРОВАНО ✓';setTimeout(()=>b.textContent=o,1400);});
    });
    const ta=c.querySelector('.ntext'), nk='ahnote_'+c.dataset.id;
    ta.value=lsGet(nk,'');
    let nt;
    ta.oninput=()=>{
      lsSet(nk,ta.value);
      clearTimeout(nt);
      nt=setTimeout(()=>cloudPush(c.dataset.id,{note:ta.value}),900);
    };
  });
  buildCollapsible();
  addControls();
  addLogout();
  cloudInit();
  addSyncUI();
  if(CLOUD.on){ cloudMigrateOnce().then(cloudPull); setInterval(cloudPull,45000); }
  // восстановить свёрнутое состояние
  document.querySelectorAll('.contact').forEach(c=>{ if(lsGet('ahcol_'+c.dataset.id,'0')==='1') c.classList.add('closed'); });
  document.querySelectorAll('.grpwrap').forEach(w=>{
    if(lsGet('ahgrp_'+(w.dataset.grp||''),'0')==='1') w.classList.add('closed');
  });
  renderFunnel();
}
function addLogout(){
  if(document.querySelector('.logout')) return;
  const b=document.createElement('button'); b.className='logout';
  b.textContent='Забыть пароль';
  b.style.cssText='font-size:11.5px;font-weight:700;padding:8px 14px;border:1px solid var(--line);border-radius:100px;background:#fff;color:var(--mut);cursor:pointer;font-family:inherit;margin-left:auto;';
  b.onclick=()=>{ try{localStorage.removeItem('ahpw')}catch(e){} location.reload(); };
  const bar=document.querySelector('.ctrls'); if(bar) bar.appendChild(b);
}
async function unlock(silent){
  const pw=silent||document.getElementById('pw').value,err=document.getElementById('err');err.textContent='';
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(IV)},key,b2u(DATA));
    document.getElementById('inject').innerHTML=new TextDecoder().decode(pt);
    document.getElementById('gate').style.display='none';
    document.getElementById('content').style.display='block';
    document.title='Astana Hub · выборка (открыто)';
    initOutreach();
    // запомнить пароль, если попросили (или если вход был автоматическим)
    const rm=document.getElementById('remember');
    if(silent || (rm&&rm.checked)) lsSet('ahpw',pw);
  }catch(e){
    if(silent){ try{localStorage.removeItem('ahpw')}catch(_){} }  // сохранённый пароль устарел
    else err.textContent='Неверный пароль';
  }
}
window.unlock=unlock;
document.getElementById('go').onclick=()=>unlock();
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
// автовход, если пароль сохранён
(function(){ const saved=lsGet('ahpw',''); if(saved) unlock(saved); })();
</script>
